[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = INFLUX_TOKEN
  organization = "FEUP"
  bucket = "Data_size_debug"
  flush_interval = "500ms"
  namepass = ["sensor_data"]
  
[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = INFLUX_TOKEN
  organization = "FEUP"
  bucket = "Data_size_debug"
  flush_interval = "500ms"
  namepass = ["sensor_data_processed"]


# # A plugin that can transmit metrics over WebSocket.
[[outputs.websocket]]

  url = "ws://localhost:3000/api/live/push/telegraf_daq"
  flush_interval = "50ms"
  data_format = "influx"
  [outputs.websocket.headers]
    Authorization = f"Bearer {GRAFANA_TOKEN}"


